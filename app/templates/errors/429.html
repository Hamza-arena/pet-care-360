{% extends "base.html" %}
{% block title %}Too Many Requests (429){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="card p-5 shadow-sm mx-auto" style="max-width: 550px;">
    <div class="text-warning mb-3">
      <i class="bi bi-hourglass-split" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold">429 - Too Many Requests</h2>
    <p class="text-muted">You have exceeded the request rate limit. Please wait a few moments before trying again.</p>
    <div class="d-flex justify-content-center gap-2 mt-3">
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
        <i class="bi bi-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
