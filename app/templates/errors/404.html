{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="card p-5 shadow-sm mx-auto" style="max-width: 550px;">
    <div class="text-warning mb-3">
      <i class="bi bi-compass-fill" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold">404 - Page Not Found</h2>
    <p class="text-muted">The record or page you requested could not be located. It may have been soft-deleted or archived.</p>
    <div class="mt-3">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Back to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
