{% extends "base.html" %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="card p-5 shadow-sm mx-auto" style="max-width: 550px;">
    <div class="text-danger mb-3">
      <i class="bi bi-exclamation-octagon-fill" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold">500 - Internal Server Error</h2>
    <p class="text-muted">A server-side error occurred. The database transaction has been safely rolled back.</p>
    <div class="mt-3">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
