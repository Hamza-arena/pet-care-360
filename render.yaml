services:
  - type: web
    name: petcare360
    runtime: python
    buildCommand: ./build.sh
    startCommand: flask db upgrade && gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production

