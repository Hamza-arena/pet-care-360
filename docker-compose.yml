version: '3.8'

services:
  web:
    build: .
    container_name: petcare360_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=staging-secure-secret-key-32charsmin!
      - DATABASE_URL=postgresql://petcare_user:petcare_pass@db:5432/petcare_db
      - MAIL_BACKEND=console
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  worker:
    build: .
    container_name: petcare360_worker
    restart: unless-stopped
    command: ["sh", "-c", "while true; do flask run-jobs; sleep 3600; done"]
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=staging-secure-secret-key-32charsmin!
      - DATABASE_URL=postgresql://petcare_user:petcare_pass@db:5432/petcare_db
      - MAIL_BACKEND=console
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: petcare360_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: petcare_user
      POSTGRES_PASSWORD: petcare_pass
      POSTGRES_DB: petcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare_user -d petcare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:

